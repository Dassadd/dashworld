<style>
:root{--bg:#f2f4fb;--fg:#1a1d29;--card:#fff;--ac:#6c4cff;--ac2:#4f6bff;--bd:#dde1f0;--dim:#6b7186;--ok:#2e9e5b;--bad:#e5484d;--sh:0 4px 18px rgba(30,30,80,.08);--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f111a;--fg:#eceef8;--card:#1a1e2e;--bd:#2c3250;--dim:#98a0bd;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0f111a;--fg:#eceef8;--card:#1a1e2e;--bd:#2c3250;--dim:#98a0bd;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}

button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}

.dim{color:var(--dim)}.sp{flex:1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.btn.danger{background:var(--bad)}.btn.small{padding:5px 10px;font-size:13px}.btn.tiny{padding:2px 6px;font-size:14px;border-radius:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.wrap{max-width:1040px;margin:0 auto;padding:16px;padding-bottom:70px}
#auth{max-width:400px;margin:8vh auto 0;padding:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}
.err{color:var(--bad);min-height:22px;font-size:14px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hb.on{background:var(--ac);color:#fff}#xh{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0009;pointer-events:none;display:none;z-index:4}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:4px;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;padding:8px 11px;cursor:pointer;white-space:nowrap;color:var(--dim);font-weight:600;font-size:14px}
.tabs button.on{color:var(--ac);border-color:var(--ac)}.tabs button:hover{background:var(--card)}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .12s;display:flex;flex-direction:column}
.gcard:hover{transform:translateY(-3px)}
.gthumb{height:112px;display:flex;align-items:center;justify-content:center;font-size:52px;background-size:cover;background-position:center;position:relative}
.gthumb .badge{position:absolute;top:6px;left:6px;font-size:11px;background:#0008;color:#fff;border-radius:6px;padding:1px 6px}
.gbody{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}.gname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.list .item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.list .item:last-child{border:0}
.stat{display:inline-block;margin:4px 14px 4px 0}.stat b{display:block;font-size:20px}
.shoprow{padding:8px 0;border-bottom:1px solid var(--bd)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sitem{border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;background:var(--card)}.sitem .ic{font-size:38px}
.sw{display:flex;gap:6px;align-items:center;margin:4px 0}.sw span{width:70px;color:var(--dim);font-size:13px}
.adrail{position:fixed;top:96px;width:170px;display:none;flex-direction:column;gap:10px;z-index:5}.adrail.l{left:max(8px,calc(50% - 450px - 186px))}.adrail.r{right:max(8px,calc(50% - 450px - 186px))}
.adlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center}.ad{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}.ad:hover{transform:translateY(-2px)}
.ad .adimg{height:88px;display:flex;align-items:center;justify-content:center;font-size:34px}.adcap{padding:6px 8px;font-size:12px;line-height:1.3}.adcap b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:1280px){.adrail{display:flex}.wrap{max-width:900px}}
.nsn{width:62px;padding:3px 4px;text-align:right;flex:none}.nsl-l{min-width:96px;font-size:13px;flex:none}.nsl.tight .nsl-l{min-width:48px}.kv .nsl{padding:0;width:100%}.kv .nsl .nsn{width:60px!important}.kv .nsl input[type=range]{width:auto!important;padding:0}.nsl input[type=range]{padding:0}
.setc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setc .card{margin:0!important;padding:10px 14px}.setc h3{margin:0 0 4px;font-size:15px}.setc .row{padding:3px 0!important}.setc .nsn{width:54px}.setc .nsl{gap:6px}.setc input[type=range]{width:100px!important;flex:none!important}@media(max-width:760px){.setc{grid-template-columns:1fr}}
.modal.xwide{max-width:900px}.modal{overflow-x:hidden}.modal .row{flex-wrap:wrap}.modal .nsl{flex-wrap:nowrap}.nsl input[type=range]{width:auto!important;flex:1 1 0!important;min-width:40px!important}.paintpad>div{min-width:0!important}.tile img{display:block}
.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:84px;min-height:84px;padding:8px 4px;background:var(--bg);border:2px solid var(--bd);border-radius:12px;cursor:pointer;color:var(--fg);font-size:12px;font-weight:600;position:relative}
.tile:hover{border-color:var(--ac)}.tile.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}.tile .ti{font-size:28px;line-height:1.1}.tile.lock{opacity:.7}.tile .lk{font-size:10px;color:var(--dim)}.tile.add{border-style:dashed}
.swrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ac)}.swrow input[type=color]{width:30px;height:28px;padding:0;border:0;background:none}
.avwrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px}@media(max-width:700px){.avwrap{grid-template-columns:1fr}}
#avprev{height:330px;border-radius:var(--r);background:linear-gradient(#cfe6ff,#f3f8ff);border:1px solid var(--bd);overflow:hidden}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--bd)}
/* overlays */
#ov{position:fixed;inset:0;background:rgba(10,12,25,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:14px;backdrop-filter:blur(3px)}
.modal{max-width:440px;width:100%;max-height:92vh;overflow:auto}.modal.wide{max-width:720px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;transition:opacity .4s}
#load .bar{width:min(300px,80vw);height:8px;border-radius:6px;background:var(--bd);overflow:hidden}#load i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#snow i{position:absolute;top:-14px;color:#9cc8ff;font-style:normal;animation:fall linear infinite;opacity:.8}@keyframes fall{to{transform:translateY(106vh) rotate(360deg)}}
/* game */
#game{position:fixed;inset:0;background:#000;display:none;z-index:50;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000}.hud button{pointer-events:auto}
#hudTop{top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hb{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 10px;cursor:pointer;backdrop-filter:blur(4px)}.hb:hover{background:rgba(0,0,0,.7)}.hb.on{background:var(--ac)}
#hs{font-weight:700;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:10px}
#hp{background:rgba(0,0,0,.5);border-radius:10px;padding:4px;width:120px}#hpb{height:10px;background:#0006;border-radius:6px;overflow:hidden}#hpf{height:100%;width:100%;transition:width .15s}
#fps{font-size:12px;opacity:.85}
#banner{position:absolute;top:26%;left:0;right:0;text-align:center;font:800 clamp(22px,5vw,38px) system-ui;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transform:scale(.9);transition:.25s}#banner.show{opacity:1;transform:none}
#hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 1px 3px #000;font-size:13px;transition:opacity 1s;pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(229,72,77,.65));opacity:0;pointer-events:none}#flash.go{animation:fl .5s}@keyframes fl{from{opacity:1}to{opacity:0}}
#emoteWheel{display:none;position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(440px,94vw);z-index:5}
#chatBox{position:absolute;left:8px;bottom:60px;width:min(340px,70vw);pointer-events:none}
#chatLog{max-height:140px;overflow:hidden;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}.cl{background:rgba(0,0,0,.4);border-radius:6px;padding:2px 8px;margin-top:2px;transition:opacity 1s}.cl.old{opacity:0}
#chatBox.open #chatLog{overflow:auto;pointer-events:auto}#chatBox.open .cl.old{opacity:1}
#chatForm{display:none;gap:4px;margin-top:4px;pointer-events:auto}#chatBox.open #chatForm{display:flex}#chatIn{flex:1}
#plist{display:none;position:absolute;top:56px;right:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:8px 10px;min-width:170px;font-size:13px}#plist.open{display:block}.pl.me{font-weight:700;color:#ffd54f}.pl.dim{opacity:.6;font-size:12px}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
#joy{display:none;position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4)}#joyk{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
.tbtn{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;touch-action:none}.tbtn.dn{background:rgba(255,255,255,.5)}
#bJump{right:18px;bottom:calc(26px + env(safe-area-inset-bottom));width:74px;height:74px}#bDash{right:104px;bottom:calc(20px + env(safe-area-inset-bottom))}#bAtk{right:30px;bottom:calc(118px + env(safe-area-inset-bottom))}#bSit{right:104px;bottom:calc(88px + env(safe-area-inset-bottom));width:46px;height:46px;font-size:18px}
/* studio */
#studioUI{display:none}body.studio #studioUI{display:block}body.studio #hudTop,body.studio #banner,body.studio #hint,body.studio #hpWrap,body.studio #chatBox,body.studio #touch,body.studio #plist,body.studio #emoteWheel,body.studio #flash{display:none!important}
.ribbon{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;align-items:center;padding:5px 8px;padding-top:calc(5px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;overflow:visible;z-index:6;color:var(--fg);scrollbar-width:none}
.rb{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--fg);white-space:nowrap;font-size:15px}.rb:hover{background:var(--bg)}.rb.on{background:var(--ac);color:#fff}.rb.accent{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
.rb.two{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 8px;min-width:48px}.rb.two .ic{font-size:18px;line-height:1.1}.rb.two .tx{font-size:10px;font-weight:700;letter-spacing:.02em;opacity:.9}.rb.snapw select{padding:1px 2px;font-size:12px;border-radius:6px}.rb.accent{font-weight:700}
.sep{width:1px;height:24px;background:var(--bd);margin:0 4px;flex:none}.st-name{width:140px;font-weight:700}.ribbon select{padding:5px}.rb.mob{display:none}
.panel{position:absolute;top:calc(var(--rbh,48px) + env(safe-area-inset-top));bottom:26px;width:210px;background:var(--card);border:1px solid var(--bd);overflow:auto;z-index:5;color:var(--fg);font-size:13px}
#stTools{left:0}#stSide{right:0;width:240px}
.panel h4{margin:0;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px}.tb{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px}.tb.wide{grid-column:span 2;flex-direction:row;justify-content:center;gap:6px;font-size:13px;padding:8px}.tb .ti{font-size:22px}.tb:hover{border-color:var(--ac)}.tb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{padding:4px 10px;cursor:pointer}.it:hover{background:var(--bg)}.it.on{background:var(--ac);color:#fff}.it.on .dim{color:#fffb}
.kv{display:flex;gap:6px;align-items:center;padding:2px 8px}.kv span{width:72px;color:var(--dim);flex:none}.kv input:not([type=checkbox]):not([type=color]),.kv select{width:100%;padding:3px 6px}.kv.wide span{width:200px}
#stStatus{position:absolute;left:0;right:0;bottom:0;height:26px;line-height:26px;padding:0 10px;background:var(--card);border-top:1px solid var(--bd);font-size:12px;color:var(--dim);z-index:6;white-space:nowrap;overflow:hidden}
textarea.code,pre.code{width:100%;height:320px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto;resize:vertical}pre.code.help{height:auto;max-height:240px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0}
.iconprev{height:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px;margin:8px 0}.thumbprev{width:100%;max-width:300px;border-radius:10px;display:block;margin:6px 0}
@media(max-width:800px){.panel{display:none;width:72vw;max-width:260px;box-shadow:0 0 30px #0007}.panel.open{display:block}.rb.mob{display:block}#stSide{width:72vw}.st-name{width:100px}}
@media(max-width:600px){.wrap{padding:10px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gthumb{height:90px}}
</style></head>
<body>
<div id="load"><div class="logo"><svg viewBox="0 0 64 64" width="56" height="56"><rect width="64" height="64" rx="16" fill="#6c4cff"/><path d="M22 14h12a18 18 0 0 1 0 36H22z" fill="#fff"/><path d="M30 22h4a10 10 0 0 1 0 20h-4z" fill="#6c4cff"/><rect x="6" y="22" width="12" height="4" rx="2" fill="#fff" opacity=".85"/><rect x="2" y="30" width="16" height="4" rx="2" fill="#fff" opacity=".85"/><rect x="8" y="38" width="10" height="4" rx="2" fill="#fff" opacity=".85"/></svg> DashWorld</div><div class="bar"><i id="loadbar"></i></div><div class="dim" id="loadmsg">Loading engine…</div></div>

<script>
'use strict';
/* ===== world.js — part definitions, colliders, character physics (pure, no DOM/THREE) ===== */

  wedge:   ['Wedge', '📐', [40, 20, 40], 0x5c6bc0, 'wedge', 1],
  corner:  ['Slope B', '🔻', [40, 20, 40], 0x7e57c2, 'wedge', 1],
  circle:  ['Cylinder', '⚪', [40, 10, 40], 0x78909c, 'circle', 1],
  ball:    ['Ball', '🔵', [30, 30, 30], 0x4fc3f7, 'ball', 1],
  triangle:['Cone', '🔺', [40, 40, 40], 0xff8a65, 'cone', 1],

  get name() { return Cloud.ses && Auth.user && !Auth.user.guest ? 'DashWorld online servers' : 'This device (local storage)'; },
  async listGames() { return Store.get('games', []); },
  async saveGame(g) {
    const a = Store.get('games', []), i = a.findIndex(x => x.id === g.id); if (i >= 0) a[i] = g; else a.push(g);
    if (!Store.set('games', a)) throw new Error('Could not save — storage is full.');

  },
  async deleteGame(id) { Store.set('games', Store.get('games', []).filter(g => g.id !== id)); try { await Cloud.deleteGame(id); } catch (e) { toast('⚠️ ' + e.message); } },

const Net = {

      const m = e.data; if (!m || m.id === this.id) return;
